  <text x="124" y="78" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#1f2328">AienOS</text>
  <text x="128" y="104" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="0.6" fill="#59636e">THE CORE TREE OF AIEN</text>
